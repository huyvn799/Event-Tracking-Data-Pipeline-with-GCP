
version: 2

models:
    - name: dim_store
      description: "Dimension table for store information"
      columns:
          - name: store_key
            data_type: integer
            description: "The unique identifier for each store"
            tests:
                - unique
                - not_null
          - name: store_id
            data_type: string
            tests:
                - unique
                - not_null
          - name: country_code
            data_type: string
            tests:
                - not_null
          - name: country_name
            data_type: string
            tests:
                - not_null
    - name: dim_currency
      description: "Dimension table for currency information"
      columns:
          - name: currency_key
            data_type: integer
            tests:
                - unique
                - not_null
          - name: currency_code
            data_type: string
            tests:
                - unique
                - not_null
          - name: currency_name
            data_type: string
            tests:
                - not_null
    - name: fact_snapshot_exchange_rate
      description: "Fact table for snapshot exchange rate of currency by date"
      data-tests:
        - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_key
              - from_currency_key
              - to_currency_key
            quote_columns: true
      columns:
          - name: date_key
            data_type: integer
            tests:
                - not_null
          - name: from_currency_key
            data_type: integer
            tests:
                - not_null
          - name: to_currency_key
            data_type: integer
            tests:
                - not_null
          - name: exchange_rate
            data_type: numeric
            tests:
                - not_null

    - name: dim_product
      description: "Dimension table for product information"
      columns:
          - name: product_key
            data_type: integer
            description: "The unique identifier for each product"
            tests:
                - unique
                - not_null
          - name: product_id
            data_type: string
            description: "The original product ID from the source system"
            tests:
                - unique
                - not_null
          - name: product_name
            data_type: string
            tests:
                - not_null
          - name: product_sku
            data_type: string
            tests:
                - not_null
          - name: attribute_set_id
            data_type: string
            tests:
                - not_null
          - name: attribute_set_name
            data_type: string
            tests:
                - not_null
          - name: packaging_type
            data_type: string
            tests:
                - not_null
          - name: collection_id
            data_type: string
            tests:
                - not_null
          - name: collection_name
            data_type: string
            tests:
                - not_null
          - name: product_type_id
            data_type: string
            tests:
                - not_null
          - name: product_type_name
            data_type: string
            tests:
                - not_null
          - name: category_id
            data_type: string
            tests:
                - not_null
          - name: category_name
            data_type: string
            tests:
                - not_null
          - name: gender
            data_type: string
            tests:
                - not_null
          - name: vnd_unit_price
            data_type: string
            tests:
                - not_null
          - name: vnd_min_price
            data_type: string
            tests:
                - not_null
          - name: vnd_max_price
            data_type: string
            tests:
                - not_null

    - name: dim_date
      description: "Dimension table for date information"
      columns:
          - name: date_key
            data_type: integer
            description: "Surrogate key for the date"
            tests:
                - unique
                - not_null
          - name: full_date
            data_type: date
            description: "The full date"
            tests:
                - not_null
                - unique

          - name: year_num
            data_type: integer
            description: "The year part of the date"
            tests:
                - not_null
          - name: quarter_num
            data_type: integer
            description: "The quarter part of the date (1-4)"
            tests:  
                - not_null
          - name: quarter_name
            data_type: string
            description: "The name of the quarter"
            tests:
                - not_null
          - name: month_num
            data_type: integer
            description: "The month part of the date"
            tests:
                - not_null
          - name: full_month_name
            data_type: string
            description: "Full month name"
            tests:
                - not_null
          - name: year_month
            data_type: string
            description: "The year and month in 'YYYY-MM' format"
            tests:
                - not_null
          - name: day_num
            data_type: integer
            description: "The day part of the date"
            tests:
                - not_null
          - name: day_of_week
            data_type: integer
            description: "The day of the week part of the date (1-7, where 1 is Monday and 7 is Sunday)"
            tests:
                - not_null
          - name: full_day_name
            data_type: string
            description: "The name of the day of the week"
            tests:
                - not_null
          - name: is_weekend
            data_type: boolean
            description: "Indicates whether the date falls on a weekend"
            tests:
                - not_null