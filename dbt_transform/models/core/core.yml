
version: 2

models:
    - name: dim_store
      description: "Dimension table for store information"
      columns:
          - name: store_key
            data_type: integer
            description: "The unique identifier for each store"
            tests:
                - unique
                - not_null

    - name: dim_date
      description: "Dimension table for date information"
      columns:
          - name: date_key
            data_type: integer
            description: "Surrogate key for the date"
            tests:
                - unique
                - not_null
          - name: full_date
            data_type: date
            description: "The full date"
            tests:
                - not_null
                - unique

          - name: year_num
            data_type: integer
            description: "The year part of the date"
            tests:
                - not_null
          - name: quarter_num
            data_type: integer
            description: "The quarter part of the date (1-4)"
            tests:  
                - not_null
          - name: quarter_name
            data_type: string
            description: "The name of the quarter"
            tests:
                - not_null
          - name: month_num
            data_type: integer
            description: "The month part of the date"
            tests:
                - not_null
          - name: full_month_name
            data_type: string
            description: "Full month name"
            tests:
                - not_null
          - name: year_month
            data_type: string
            description: "The year and month in 'YYYY-MM' format"
            tests:
                - not_null
          - name: day_num
            data_type: integer
            description: "The day part of the date"
            tests:
                - not_null
          - name: day_of_week
            data_type: integer
            description: "The day of the week part of the date (1-7, where 1 is Monday and 7 is Sunday)"
            tests:
                - not_null
          - name: full_day_name
            data_type: string
            description: "The name of the day of the week"
            tests:
                - not_null
          - name: is_weekend
            data_type: boolean
            description: "Indicates whether the date falls on a weekend"
            tests:
                - not_null