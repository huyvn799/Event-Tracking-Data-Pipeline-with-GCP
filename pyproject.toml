[project]
name = "data-pipeline-glamira"
version = "0.1.0"
description = "Event Tracking Data Pipeline with GCP"
authors = [
    {name = "huyvn799",email = "quochuy2001.kb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo (>=4.17.0,<5.0.0)",
    "ip2location (>=8.11.0,<9.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "curl-cffi (>=0.15.0,<0.16.0)",
    "playwright (>=1.59.0,<2.0.0)",
    "fake-useragent (>=2.2.0,<3.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "google-cloud-storage (>=3.10.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
